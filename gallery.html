        .close-button {

                    4px 4px 8px rgba(0, 0, 0, 0.3),

<body id="projectsBody">

<div id="navContainer">
    <nav>
        <ul class="nav-bar">
            <li><a href="projects.html" class="unselected">projects</a></li>
            <li><a href="gallery.html">gallery</a></li>
            <li><a href="about.html" class="unselected">about</a></li>
            <li><a href="index.html#home" id="specialText">ISA</a></li>
        </ul>
    </nav>
</div>

<div class="projectIntroducer">
    <div class="imageContainer" style="background-image: url('img/gallery/9_max.png')"></div>
    <h1>GALLERY</h1>
</div>

<!-- Loader Element (p5.js automatically displays this during preload and hides it on setup) -->
<div id="p5_loading">
    <div class="loader-spinner"></div>
    <div class="loader-text">Loading Gallery...</div>
</div>

<div id="sketchContainer2"></div>

<!-- Popup element -->
<div id="popupOverlay" onclick="closePopup(event)">
    <div class="popup" onclick="event.stopPropagation()">
        <i class="fas fa-times close-button" onclick="closePopup(event)"></i>
        <img id="popupImage" src="" alt="Larger version">
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.11.0/lib/p5.min.js"></script>

<script>
    const numImages = 40;
    let srcText = `img/gallery/`;
    let columns;
    let images = [];
    let itemStates = []; // Track individual states for smooth transitions

    let columnHeights = [0, 0, 0];
    const margin = 25;
    let imgWidth;
    let popupOpen = false;
    let currentPopupIndex = -1;

    let startX = 0;
    let startY = 0;

    function preload() {
        for (let i = 1; i <= numImages; i++) {
            images.push(loadImage(srcText + `${i}.png`));
            // Initialize transition states for Container Scale, Image Scale, and Dim Alpha
            itemStates.push({ contScale: 1, imgScale: 1, dimOpacity: 0 });
        }
    }

    function setup() {
        let c = createCanvas(100, 100);
        c.parent('sketchContainer2');
        calculateLayout();
    }

    function calculateLayout() {
        const container = document.getElementById('sketchContainer2');
        if (!container) return;

        const containerWidth = container.offsetWidth;
        const availableWidth = containerWidth - 2 * margin;
        imgWidth = availableWidth / 3;

        columns = [[], [], []];
        columnHeights = [0, 0, 0];

        images.forEach((img, index) => {
            let aspectRatio = img.height / img.width;
            let displayHeight = imgWidth * aspectRatio;

            const shortestColumnIndex = columnHeights.indexOf(Math.min(...columnHeights));

            columns[shortestColumnIndex].push({
                img,
                originalIndex: index + 1,
                w: imgWidth,
                h: displayHeight
            });

            columnHeights[shortestColumnIndex] += displayHeight + margin;
        });

        const totalHeight = Math.max(...columnHeights) + margin;
        resizeCanvas(containerWidth, totalHeight);
    }

    function windowResized() {
        calculateLayout();
    }

    function mousePressed() {
        startX = mouseX;
        startY = mouseY;
    }

    function mouseReleased() {
        if (popupOpen) return;

        if (mouseX < 0 || mouseX > width || mouseY < 0 || mouseY > height) return;

        let d = dist(startX, startY, mouseX, mouseY);
        if (d > 10) return;

        let xOffset = margin / 2;
        for (let columnIndex = 0; columnIndex < columns.length; columnIndex++) {
            let yOffset = margin / 2;
            for (let i = 0; i < columns[columnIndex].length; i++) {
                let item = columns[columnIndex][i];

                if (mouseX > xOffset && mouseX < xOffset + item.w &&
                    mouseY > yOffset && mouseY < yOffset + item.h) {
                    openPopup(item.originalIndex);
                    return;
                }

                yOffset += item.h + margin;
            }
            xOffset += imgWidth + margin;
        }
    }

    function draw() {
        background('#090E1E');

        let hoveredIndex = -1;

        // 1. Determine which item is currently hovered over
        let checkX = margin / 2;
        for (let columnIndex = 0; columnIndex < columns.length; columnIndex++) {
            let checkY = margin / 2;
            for (let i = 0; i < columns[columnIndex].length; i++) {
                let item = columns[columnIndex][i];
                if (!popupOpen && mouseX > checkX && mouseX < checkX + item.w && mouseY > checkY && mouseY < checkY + item.h) {
                    hoveredIndex = item.originalIndex - 1;
                }
                checkY += item.h + margin;
            }
            checkX += imgWidth + margin;
        }

        if (hoveredIndex !== -1 && !popupOpen) {
            cursor(HAND);
        } else {
            cursor(ARROW);
        }

        let normalItems = [];
        let elevatedItems = [];

        // 2. Map transition states & split layering
        let xOffset = margin / 2;
        for (let columnIndex = 0; columnIndex < columns.length; columnIndex++) {
            let yOffset = margin / 2;
            for (let i = 0; i < columns[columnIndex].length; i++) {
                let item = columns[columnIndex][i];
                let sIndex = item.originalIndex - 1;
                let state = itemStates[sIndex];

                let isHovered = (hoveredIndex === sIndex);

                // Target expand values
                let targetContScale = isHovered ? 1.015 : 1;
                let targetImgScale = isHovered ? 1.05 : 1;
                let targetDim = isHovered ? 0.7 : 0;

                // Smoothly interpolate values
                state.contScale = lerp(state.contScale, targetContScale, 0.15);
                state.imgScale = lerp(state.imgScale, targetImgScale, 0.15);
                state.dimOpacity = lerp(state.dimOpacity, targetDim, 0.15);

                // OPTIMIZATION: Snap values exactly to target when close,
                // ensuring the browser doesn't compute infinite decimal animations.
                if (Math.abs(state.contScale - targetContScale) < 0.001) state.contScale = targetContScale;
                if (Math.abs(state.imgScale - targetImgScale) < 0.001) state.imgScale = targetImgScale;
                if (Math.abs(state.dimOpacity - targetDim) < 0.001) state.dimOpacity = targetDim;

                let drawData = { item, x: xOffset, y: yOffset, state };

                // Ensure hovered/animating items render on top of overlapping idle neighbors
                if (state.contScale > 1.001) {
                    elevatedItems.push(drawData);
                } else {
                    normalItems.push(drawData);
                }

                yOffset += item.h + margin;
            }
            xOffset += imgWidth + margin;
        }

        // 3. Draw Normal items first
        for (let d of normalItems) {
            drawGalleryItem(d);
        }

        // 4. Draw Elevated items on top
        for (let d of elevatedItems) {
            drawGalleryItem(d);
        }
    }

    function drawGalleryItem(d) {
        let { item, x, y, state } = d;
        let w = item.w;
        let h = item.h;

        push();
        translate(x + w / 2, y + h / 2);

        // OPTIMIZATION: Is this specific item currently expanding, fading, or zooming?
        let isActive = state.contScale > 1 || state.imgScale > 1 || state.dimOpacity > 0;

        if (isActive) {
            scale(state.contScale);

            // 1. Draw Container Drop Shadow
            if (state.contScale > 1) {
                let shadowY = map(state.contScale, 1, 1.015, 4, 15);
                let shadowBlur = map(state.contScale, 1, 1.015, 10, 30);
                let shadowAlpha = map(state.contScale, 1, 1.015, 0.3, 0.5);

                drawingContext.shadowOffsetX = 0;
                drawingContext.shadowOffsetY = shadowY;
                drawingContext.shadowBlur = shadowBlur;
                drawingContext.shadowColor = `rgba(0,0,0,${shadowAlpha})`;

                noStroke();
                fill('#090E1E');
                rectMode(CENTER);
                rect(0, 0, w, h);

                // Reset shadow so it doesn't bleed into the image
                drawingContext.shadowColor = 'transparent';
                drawingContext.shadowBlur = 0;
            }

            // 2. Draw Clipped Image
            drawingContext.save();
            drawingContext.beginPath();
            drawingContext.rect(-w / 2, -h / 2, w, h);
            drawingContext.clip();

            scale(state.imgScale);
            imageMode(CENTER);
            image(item.img, 0, 0, w, h);

            drawingContext.restore();

            // 3. Draw Dim Overlay
            if (state.dimOpacity > 0) {
                noStroke();
                fill(9, 14, 30, state.dimOpacity * 255);
                rectMode(CENTER);
                rect(0, 0, w, h);
            }

        } else {
            // HIGH PERFORMANCE PATH (Bypasses Shadows and Clipping Masks for Idle Images)
            imageMode(CENTER);
            image(item.img, 0, 0, w, h);
        }

        pop();
    }

    function openPopup(originalIndex) {
        popupOpen = true;
        currentPopupIndex = originalIndex;
        const popupOverlay = document.getElementById('popupOverlay');
        const popupImage = document.getElementById('popupImage');

        popupImage.src = srcText + `${originalIndex}.png`;
        popupOverlay.style.display = 'flex';

        const highResUrl = srcText + `${originalIndex}_max.png`;
        const imgLoader = new Image();
        imgLoader.src = highResUrl;

        imgLoader.onload = () => {
            if (popupOpen && currentPopupIndex === originalIndex) {
                popupImage.src = highResUrl;
            }
        };
    }

    function closePopup(event) {
        if (event) event.stopPropagation();

        popupOpen = false;
        currentPopupIndex = -1;
        document.getElementById('popupOverlay').style.display = 'none';
    }

    document.addEventListener('keydown', function(event) {
        if (popupOpen && (event.key === 'Enter' || event.key === 'Escape')) {
            closePopup(event);
        }
    });
</script>

</body>
</html>
