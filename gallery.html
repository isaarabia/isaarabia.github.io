<!-- Popup element -->
<div id="popupOverlay" onclick="closePopup(event)">
    <div class="popup" onclick="event.stopPropagation()">
        <i class="fas fa-times close-button" onclick="closePopup(event)"></i>
        <img id="popupImage" src="" alt="Larger version">
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/p5@1.11.0/lib/p5.min.js"></script>


<script>


    const numImages = 41;
    let srcText = `img/gallery/`;


    let columns;
    let images = [];


    let columnHeights = [0, 0, 0];
    const margin = 25; // Margin in pixels for both horizontal and vertical spacing
    let imgWidth;
    let popupOpen = false; // To track if the popup is open
    let currentPopupIndex = -1; // To track which image is currently targeted by the popup


    function preload() {
        for (let i = 1; i <= numImages; i++) {
            images.push(loadImage(srcText + `${i}.png`));
        }
    }


    function setup() {
        // Create canvas initially; size will be set by calculateLayout
        let c = createCanvas(100, 100);
        c.parent('sketchContainer2');

        // Calculate initial layout
        calculateLayout();
    }


    // Helper function to calculate grid layout based on current window width
    function calculateLayout() {
        const container = document.getElementById('sketchContainer2');
        if (!container) return;


        const containerWidth = container.offsetWidth;
        const availableWidth = containerWidth - 2 * margin;
        imgWidth = availableWidth / 3;


        columns = [[], [], []];
        columnHeights = [0, 0, 0];


        images.forEach((img, index) => {
            // Calculate display height based on new width (preserving aspect ratio)
            let aspectRatio = img.height / img.width;
            let displayHeight = imgWidth * aspectRatio;


            const shortestColumnIndex = columnHeights.indexOf(Math.min(...columnHeights));

            // Store image with its calculated display dimensions
            columns[shortestColumnIndex].push({
                img,
                originalIndex: index + 1,
                w: imgWidth,
                h: displayHeight
            });

            columnHeights[shortestColumnIndex] += displayHeight + margin;
        });


        const totalHeight = Math.max(...columnHeights) + margin;
        resizeCanvas(containerWidth, totalHeight);
    }


    // p5.js event that triggers when window is resized
    function windowResized() {
        calculateLayout();
    }


    function draw() {
        background('#090E1E');


        let xOffset = margin / 2;
        let cursorSet = false; // to check if cursor should be set to HAND


        for (let columnIndex = 0; columnIndex < columns.length; columnIndex++) {
            let yOffset = margin / 2;
            columns[columnIndex].forEach(({ img, originalIndex, w, h }) => {

                // Check if mouse is over the image using the calculated dimensions (w, h)
                let isHovering = mouseX > xOffset && mouseX < xOffset + w && mouseY > yOffset && mouseY < yOffset + h;

                // Check if hovering AND popup is closed
                if (!popupOpen && isHovering) {
                    cursor(HAND);
                    tint(255, 229);
                    cursorSet = true;
                } else {
                    noTint();
                }

                // Draw image using calculated dimensions
                image(img, xOffset, yOffset, w, h);


                // Only allow clicking if popup is closed
                if (!popupOpen && isHovering) {
                    if (mouseIsPressed) openPopup(originalIndex);
                }


                yOffset += h + margin;
            });
            xOffset += imgWidth + margin;
        }


        if (!cursorSet) {
            cursor(ARROW);
        }
    }


    function openPopup(originalIndex) {
        popupOpen = true;
        currentPopupIndex = originalIndex;
        const popupOverlay = document.getElementById('popupOverlay');
        const popupImage = document.getElementById('popupImage');


        // 1. Immediately show the low-res version.
        popupImage.src = srcText + `${originalIndex}.png`;
        popupOverlay.style.display = 'flex';


        // 2. Start loading the high-res version in the background.
        const highResUrl = srcText + `${originalIndex}_max.png`;
        const imgLoader = new Image();
        imgLoader.src = highResUrl;

        imgLoader.onload = () => {
            if (popupOpen && currentPopupIndex === originalIndex) {
                popupImage.src = highResUrl;
            }
        };
    }


    function closePopup(event) {
        if (event) event.stopPropagation();

        popupOpen = false;
        currentPopupIndex = -1;
        document.getElementById('popupOverlay').style.display = 'none';
    }


    document.addEventListener('keydown', function(event) {
        if (popupOpen && (event.key === 'Enter' || event.key === 'Escape')) {
            closePopup(event);
        }
    });


</script>
