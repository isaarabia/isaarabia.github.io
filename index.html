<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Isa Arabia | Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="apple-touch-icon" sizes="180x180" href="https://isaarabia.github.io//apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://isaarabia.github.io//favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://isaarabia.github.io//favicon-16x16.png">
    <link rel="manifest" href="https://isaarabia.github.io//site.webmanifest">

    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">

    <style>
        /*
        ====================================================
           General Styles
        ====================================================
        */
        body {
            overflow: hidden;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: #090E1E !important;
        }

        /* This new rule disables transitions when the body has the .no-transition class */
        body.no-transition #leftPanel,
        body.no-transition #primatePhoto,
        body.no-transition .headerText {
            transition: none !important;
        }

        #contentWrapper {
            height: 100vh; /* Same height as viewport */
            width: 100vw; /* Same width as viewport */
            overflow: hidden; /* No scrolling inside the wrapper */
            position: fixed; /* Fixed positioned to prevent natural scrolling */
        }

        /*
        ====================================================
           Hero Image
        ====================================================
        */
        #homeHero {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .image-container {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .image-container img {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: auto;
            min-width: 100%;
            object-fit: cover;
            transition: transform 0.8s ease-in-out;
            transform: translateX(0%);
        }

        /*
        ====================================================
           Hero Text
        ====================================================
        */
        .headerText {
            font-family: "Arial Black";
            font-weight: 800;
            font-size: 20vw;
            color: #fff;
            mix-blend-mode: difference;
            z-index: 2; /* Ensure text is above all other content */
            transition: 0.8s ease-in-out; /* Adjusted transition timing */
        }

        #overlayTextHolder {
            margin-left: 3vw;
        }

        #overlayTextHolder > #overlayText {
            position: absolute;
            bottom: -0.5vw;
        }

        #overlayTextHolder > #topText {
            position: absolute;
            bottom: 16.5vw;
        }

        #topText.top-minimized {
            font-size: 15vw;
            bottom: 11.5vw !important;
        }

        #overlayText.overlay-minimized {
            font-size: 15vw;
            bottom: -0.5vw !important;
        }

        /*
        ====================================================
           Sliding Panel
        ====================================================
        */
        #leftPanel {
            background: #090D1E;
            width: 48vw;
            height: 100vh;
            position: fixed;
            top: 0;
            right: -48vw;
            transition: right 0.8s ease-in-out;
        }

        body.animation-triggered #leftPanel {
            right: 0;
        }

        body.animation-triggered #primatePhoto {
            transform: translateX(-26%);
        }

        /*
        ====================================================
           Navigation Bar & C2A Text
        ====================================================
        */
        .nav-bar { list-style-type: none; padding: 0; display: flex; justify-content: space-around; flex-direction: row; margin-top: 25px; margin-left: 40px; margin-right: 40px; }
        .nav-bar li { flex: 1; font-family: Montserrat; font-weight: 200; font-size: 16pt; padding: 10px; }
        .nav-bar li a { display: block; color: white; text-align: center; text-decoration: none; transition: 0.2s; }
        .nav-bar li a:hover { opacity: 1; }
        #specialText { color: #8C7BE2; font-weight: 800; font-size: 30pt; transform: translateY(-14px); padding-left: 3px; transition: 0.2s; }
        #c2aText { display: flex; justify-content: flex-end; flex-direction: column; margin-top: 40px; margin-right: 8vw; margin-left: 5vw; }
        #portrait { width: 275px; height: 275px; border-radius: 50%; overflow: hidden; object-fit: cover; margin: 0 0 0 auto; transition: 0.2s; }
        #portrait:hover { transform: scale(0.98) rotateZ(2deg) rotateX(2deg); }
        #c2aText > h1, #c2aText > p { font-family: Montserrat; text-align: right; transform: translateY(0px); }
        #c2aText > h1 { color: #F6F2E0; font-weight: 700; font-size: 48pt; }
        #c2aText > p { color: #EBE5ED; font-size: 22pt; font-weight: 400; margin-top: -5px; }
        .unselected { opacity: 0.7; }

        /*
       ====================================================
          Icon Styles
       ====================================================
       */
        .icon-row {
            text-align: right;
            margin-top: 15px;
        }

        .icon-row a {
            color: #fff;
            margin: 0 10px;
            font-size: 24pt;
            transition: color 0.3s;
            text-decoration: none;
        }

        .icon-row a:hover {
            color: #8C7BE2;
        }

        /*
        ====================================================
          Bouncing Arrow Styles
        ====================================================
        */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0) rotate(45deg);
            }
            40% {
                transform: translateY(-40px) rotate(45deg);
            }
            60% {
                transform: translateY(-20px) rotate(45deg);
            }
        }

        #bouncingArrow {
            display: inline-block;
            vertical-align: middle;
            margin-left: 4vw;
            margin-bottom: 2vw; /* Helps with vertical centering */
            cursor: pointer;
            animation: bounce 2.5s infinite;
            width: 2vw;
            height: 2vw;
            border-bottom: 0.65vw solid #fff;
            border-right: 0.65vw solid #fff;
            transform: rotate(45deg);
            opacity: 1;
            transition: opacity 0.5s ease-out;
            /* Make this a positioning context for the pseudo-element */
            position: relative;
        }

        /* This pseudo-element creates the larger, invisible click area */
        #bouncingArrow::after {
            content: '';
            position: absolute;
            /* These negative values expand the pseudo-element outwards */
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
        }

        body.animation-triggered #bouncingArrow {
            opacity: 0;
            /* Disable pointer events after it's clicked */
            pointer-events: none;
        }

        /*
        ====================================================
           Screen Re-sizing (Media Queries)
        ====================================================
        */
        @media (max-width: 1300px) { body.animation-triggered #primatePhoto { transform:translateX(-35%) !important; } }
        @media (max-width: 1000px) { body.animation-triggered #primatePhoto { transform:translateX(-45%) !important; } .image-container img { transform: translateX(-20%); } }
        @media (max-width: 850px) {
            #overlayText { display: none; }
            .headerText { font-size: 40vw; margin-bottom: 40px; }
            #textHolder { padding-left: 10px; bottom: 2vw !important; }
            #topText.top-minimized { display: none; }
            #leftPanel { width: 100vw; right: -100vw; }
            #c2aText > h1, #c2aText > p { text-align: center; }
            #c2aText { margin-right: 0vw; }
            .icon-row { text-align: center; }
            #portrait { margin: 0 auto 20px auto; }
        }
        @media (max-width: 800px) { .image-container img { transform: translateX(-40%); } }
        @media (max-width: 1215px) { #c2aText > h1 { font-size: 38pt; } #c2aText > p { font-size: 18pt; } }
        @media (max-width: 980px) { #c2aText > h1 { font-size: 34pt; } }
        @media (max-width: 650px) {
            #c2aText {
                margin-left: 0;
                margin-top: 0;
            }
            #portrait { width: 200px; height: 200px;}
        }
    </style>
</head>
<body>
<div id="contentWrapper">
    <div id="homeHero">
        <div class="image-container">
            <img src="img/backgroundPhoto.jpg" alt="Responsive Image" id="primatePhoto">
        </div>
        <div id="textHolder">
            <div id="blendWrapper">
            </div>
        </div>
    </div>
</div>
<div id="leftPanel">
    <nav>
        <ul class="nav-bar">
            <li><a href="cv.html" class="unselected">cv</a></li>
<!--            <li><a href="#about" class="unselected">projects</a></li>-->
            <li><a href="gallery.html" class="unselected">gallery</a></li>
            <li><a href="about.html" class="unselected">about</a></li>
            <li><a href="index.html#home" id="specialText">ISA</a></li>
        </ul>
    </nav>
    <div id="c2aText">
        <img id="portrait" src="img/portrait_cropped.jpg">
        <h1>science + art</h1>
        <p>a creative approach to <br>behavioral ecology</p>
        <div class="icon-row">
            <a href="https://www.linkedin.com/in/isabellaarabia/" target="_blank" aria-label="LinkedIn" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="https://docs.google.com/document/d/1w2Lj0Rw6Lr9Wsm6LHSGSnvk-2OtMB6d6/edit?usp=sharing&ouid=117979881791114394248&rtpof=true&sd=true" target="_blank" aria-label="CV" title="CV"><i class="fa fa-file-text"></i></a>
            <a href="https://scholar.google.com/citations?user=6BErEB8AAAAJ&hl=en&oi=ao" target="_blank" aria-label="Google Scholar" title="Google Scholar"><i class="fa-brands fa-google-scholar"></i></a>
            <a href="mailto:isabella.arabia@tufts.edu" aria-label="Email" title="Email"><i class="fa fa-envelope"></i></a>
        </div>
    </div>
</div>
<div id="overlayTextHolder">
    <h1 class="headerText" id="topText">ISA<span id="bouncingArrow" title="Click to Explore"></span></h1>
    <h1 class="headerText" id="overlayText">ARABIA</h1>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const mobileBreakpoint = 850;
        const topText = document.getElementById('topText');
        const overlayText = document.getElementById('overlayText');
        const bouncingArrow = document.getElementById('bouncingArrow');
        // This function applies all the "post-scroll" styles
        function applyFinalState() {
            document.body.classList.add('animation-triggered');
            topText.classList.add('top-minimized');
            overlayText.classList.add('overlay-minimized');
            // Clean up event listeners so they don't fire again
            document.removeEventListener('wheel', applyFinalState);
            if (bouncingArrow) {
                bouncingArrow.removeEventListener('click', applyFinalState);
            }
        }

        // It checks for the URL hash OR the mobile breakpoint.
        if (window.location.hash === '#home' || window.innerWidth <= mobileBreakpoint) {
            // If the hash is present or it's a mobile screen, apply the final state immediately.
            // A class is added to the body to disable transitions during this initial setup.
            document.body.classList.add('no-transition');
            applyFinalState();
            // The no-transition class is removed after a very short delay.
            // This ensures that any subsequent actions (like browser resizing) will be animated.
            setTimeout(() => {
                document.body.classList.remove('no-transition');
            }, 10);
        } else {
            // On desktop without a hash, add the original event listeners to trigger the animation on scroll or click.
            document.addEventListener('wheel', applyFinalState, { once: true });
            if (bouncingArrow) {
                bouncingArrow.addEventListener('click', applyFinalState, { once: true });
            }
        }
    });
</script>
<script src="https://kit.fontawesome.com/b5f3cf720c.js" crossorigin="anonymous"></script>
</body>
</html>
